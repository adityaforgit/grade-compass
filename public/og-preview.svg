<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Blue Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="220" fill="#2563eb" opacity="0.18" filter="url(#glow)" />
  <circle cx="1050" cy="480" r="260" fill="#6366f1" opacity="0.18" filter="url(#glow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 110)">
    <!-- Brand Pill Tag -->
    <rect width="320" height="42" rx="21" fill="rgba(37, 99, 235, 0.2)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="35" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#60a5fa" letter-spacing="1.5">MAKAUT GRADE CALCULATOR</text>

    <!-- Main Title: GradeCompass -->
    <g transform="translate(0, 85)">
      <!-- Compass Icon Circle -->
      <circle cx="36" cy="-14" r="34" fill="none" stroke="#3b82f6" stroke-width="4" />
      <polygon points="36,-34 44,-14 36,6 28,-14" fill="#38bdf8" />
      <polygon points="36,6 44,-14 36,-34 28,-14" fill="#2563eb" opacity="0.6" />
      
      <text x="90" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">Grade<tspan fill="#3b82f6">Compass</tspan></text>
    </g>

    <!-- Tagline: Calculate. Plan. Achieve. -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#94a3b8" letter-spacing="0.5">Calculate <tspan fill="#60a5fa">•</tspan> Plan <tspan fill="#60a5fa">•</tspan> Achieve</text>

    <!-- Subtitle Description -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1">
      <tspan x="0" dy="0">Instant end-semester exam marks reverse calculation,</tspan>
      <tspan x="0" dy="28">CA/ECA/WCA normalization, and SGPA tracking for MAKAUT.</tspan>
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 290)">
      <!-- Badge 1: No 28/70 floor -->
      <rect width="210" height="38" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">✓ 40/100 Aggregate Pass</text>

      <!-- Badge 2: 11 Branches -->
      <g transform="translate(225, 0)">
        <rect width="180" height="38" rx="10" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1.2" />
        <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc">✓ 11 B.Tech Branches</text>
      </g>

      <!-- Badge 3: 100% Free -->
      <g transform="translate(420, 0)">
        <rect width="170" height="38" rx="10" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1.2" />
        <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fb7185">✓ 100% Client-Side</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Preview: Mock Score Matrix Card -->
  <g transform="translate(750, 110)">
    <!-- Floating Card Container -->
    <rect width="360" height="410" rx="24" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

    <!-- Card Header -->
    <rect width="360" height="54" rx="24" fill="rgba(255, 255, 255, 0.04)" />
    <circle cx="28" cy="27" r="5" fill="#f43f5e" />
    <circle cx="44" cy="27" r="5" fill="#fbbf24" />
    <circle cx="60" cy="27" r="5" fill="#10b981" />
    <text x="80" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#94a3b8">Target Marks Matrix (ESE / 70)</text>

    <!-- Mini Score Cards -->
    <!-- O Grade: 10 Pointer -->
    <g transform="translate(24, 75)">
      <rect width="312" height="60" rx="14" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <rect x="14" y="13" width="34" height="34" rx="8" fill="#10b981" />
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff">O</text>
      <text x="60" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">10 Pointer (90-100)</text>
      <text x="60" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Outstanding grade</text>
      <text x="250" y="38" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#34d399">69 / 70</text>
    </g>

    <!-- E Grade: 9 Pointer -->
    <g transform="translate(24, 150)">
      <rect width="312" height="60" rx="14" fill="rgba(20, 184, 166, 0.1)" stroke="rgba(20, 184, 166, 0.3)" stroke-width="1" />
      <rect x="14" y="13" width="34" height="34" rx="8" fill="#14b8a6" />
      <text x="25" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff">E</text>
      <text x="60" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">9 Pointer (80-89)</text>
      <text x="60" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Excellent grade</text>
      <text x="250" y="38" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#2dd4bf">59 / 70</text>
    </g>

    <!-- A Grade: 8 Pointer -->
    <g transform="translate(24, 225)">
      <rect width="312" height="60" rx="14" fill="rgba(59, 130, 246, 0.1)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1" />
      <rect x="14" y="13" width="34" height="34" rx="8" fill="#3b82f6" />
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff">A</text>
      <text x="60" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">8 Pointer (70-79)</text>
      <text x="60" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Very Good grade</text>
      <text x="250" y="38" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#60a5fa">49 / 70</text>
    </g>

    <!-- D Grade: Pass Cutoff -->
    <g transform="translate(24, 300)">
      <rect width="312" height="60" rx="14" fill="rgba(244, 63, 94, 0.1)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1" />
      <rect x="14" y="13" width="34" height="34" rx="8" fill="#f43f5e" />
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff">D</text>
      <text x="60" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Pass Cutoff (40-49)</text>
      <text x="60" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">No 28 floor required</text>
      <text x="250" y="38" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#fb7185">19 / 70</text>
    </g>

    <!-- Bottom URL Stamp -->
    <text x="180" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#64748b">gradecompass.vercel.app</text>
  </g>
</svg>

